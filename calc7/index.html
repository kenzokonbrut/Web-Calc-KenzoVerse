<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA Precision Workstation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg-main: #0c0d10;
  --surface-card: #14161d;
  --surface-display: #090a0d;
  --surface-hover: #1f222d;
  
  --border-subtle: rgba(255, 255, 255, 0.07);
  --border-active: rgba(255, 255, 255, 0.18);
  
  --btn-num: #181a22;
  --btn-num-hover: #222531;
  --btn-func: #212532;
  --btn-func-hover: #2d3244;
  --btn-accent: #3b82f6;
  --btn-accent-hover: #2563eb;
  
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #475569;
  --accent-cyan: #38bdf8;
  --accent-amber: #f59e0b;
  
  --radius-outer: 28px;
  --radius-btn: 14px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Inter', -apple-system, sans-serif;
  user-select: none;
}

body {
  background-color: var(--bg-main);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background-image: 
    radial-gradient(ellipse at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 70%),
    radial-gradient(ellipse at 80% 100%, rgba(59, 130, 246, 0.05) 0%, transparent 60%);
}

.workstation {
  width: 100%;
  max-width: 440px;
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-outer);
  padding: 24px;
  box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: relative;
}

/* Header & Status */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--text-secondary);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-dot {
  width: 6px;
  height: 6px;
  background: var(--accent-cyan);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent-cyan);
}

.status-group {
  display: flex;
  gap: 6px;
}

.badge {
  font-size: 0.68rem;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-muted);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: all 0.2s ease;
}

.badge.active {
  color: var(--accent-cyan);
  background: rgba(56, 189, 248, 0.1);
  border-color: rgba(56, 189, 248, 0.25);
}

/* Display Screen */
.screen {
  background: var(--surface-display);
  border: 1px solid var(--border-subtle);
  border-radius: 18px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: space-between;
  min-height: 110px;
  transition: border-color 0.2s;
}

.screen:hover {
  border-color: var(--border-active);
}

.sub-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  color: var(--text-secondary);
  min-height: 1.2rem;
  word-break: break-all;
  opacity: 0.8;
}

.main-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 2.2rem;
  font-weight: 500;
  color: var(--text-primary);
  width: 100%;
  text-align: right;
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
}

.main-display::-webkit-scrollbar { display: none; }

/* Control Bar */
.control-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 4px;
}

.text-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-size: 0.75rem;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color 0.2s;
}

.text-btn:hover {
  color: var(--text-primary);
}

/* Keypad Grid (5 columns) */
.keypad {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

button.k-btn {
  height: 52px;
  border-radius: var(--radius-btn);
  border: 1px solid transparent;
  background: var(--btn-num);
  color: var(--text-primary);
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
  outline: none;
}

button.k-btn:hover {
  background: var(--btn-num-hover);
  border-color: var(--border-subtle);
}

button.k-btn:active, button.k-btn.active {
  transform: scale(0.96);
  border-color: var(--border-active);
}

button.func {
  background: var(--btn-func);
  color: var(--text-secondary);
  font-size: 0.85rem;
}

button.func:hover {
  background: var(--btn-func-hover);
  color: var(--text-primary);
}

button.op {
  background: rgba(59, 130, 246, 0.12);
  color: var(--accent-cyan);
  border: 1px solid rgba(56, 189, 248, 0.15);
  font-weight: 600;
}

button.op:hover {
  background: rgba(59, 130, 246, 0.22);
}

button.equals {
  background: var(--btn-accent);
  color: #ffffff;
  font-weight: 600;
  grid-column: span 2;
}

button.equals:hover {
  background: var(--btn-accent-hover);
}

/* History Modal */
.history-overlay {
  position: absolute;
  inset: 0;
  background: rgba(12, 13, 16, 0.96);
  backdrop-filter: blur(12px);
  border-radius: var(--radius-outer);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 20;
}

.history-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 12px;
}

.history-title {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.history-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.history-list::-webkit-scrollbar { width: 4px; }
.history-list::-webkit-scrollbar-thumb {
  background: var(--border-subtle);
  border-radius: 4px;
}

.history-item {
  text-align: right;
  padding: 10px;
  background: rgba(255, 255, 255, 0.02);
  border-radius: 10px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
}

.history-item:hover {
  background: var(--surface-hover);
  border-color: var(--border-subtle);
}

.history-expr {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.history-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.1rem;
  color: var(--text-primary);
  font-weight: 500;
}
</style>
</head>
<body>

<div class="workstation">
  
  <!-- Header Bar -->
  <header class="header">
    <div class="brand">
      <div class="brand-dot"></div>
      AURA PRO
    </div>
    <div class="status-group">
      <div class="badge active" id="badge-deg">DEG</div>
      <div class="badge" id="badge-mem">MEM: 0</div>
    </div>
  </header>

  <!-- Display -->
  <section class="screen">
    <div class="sub-display" id="sub-display"></div>
    <div class="main-display" id="display">0</div>
  </section>

  <!-- Secondary Actions -->
  <div class="control-bar">
    <button class="text-btn" id="history-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Riwayat
    </button>
    <button class="text-btn" id="clear-mem-btn">Clear Memory</button>
  </div>

  <!-- Keypad Grid -->
  <main class="keypad">
    <!-- Row 1: Sci Functions -->
    <button class="k-btn func" data-val="sin">sin</button>
    <button class="k-btn func" data-val="cos">cos</button>
    <button class="k-btn func" data-val="tan">tan</button>
    <button class="k-btn func" data-val="rad-deg">D/R</button>
    <button class="k-btn func" data-key="Escape" data-val="AC">AC</button>

    <!-- Row 2: Advanced Math -->
    <button class="k-btn func" data-val="log">log</button>
    <button class="k-btn func" data-val="ln">ln</button>
    <button class="k-btn func" data-val="!">x!</button>
    <button class="k-btn func" data-val="^">xʸ</button>
    <button class="k-btn func" data-key="Backspace" data-val="⌫">⌫</button>

    <!-- Row 3: Math Constants & Brackets -->
    <button class="k-btn func" data-val="√">√</button>
    <button class="k-btn func" data-val="(">(</button>
    <button class="k-btn func" data-val=")">)</button>
    <button class="k-btn func" data-val="%">%</button>
    <button class="k-btn op" data-key="/" data-val="÷">÷</button>

    <!-- Row 4: Numpad 1 -->
    <button class="k-btn" data-key="7" data-val="7">7</button>
    <button class="k-btn" data-key="8" data-val="8">8</button>
    <button class="k-btn" data-key="9" data-val="9">9</button>
    <button class="k-btn func" data-val="MS">MS</button>
    <button class="k-btn op" data-key="*" data-val="×">×</button>

    <!-- Row 5: Numpad 2 -->
    <button class="k-btn" data-key="4" data-val="4">4</button>
    <button class="k-btn" data-key="5" data-val="5">5</button>
    <button class="k-btn" data-key="6" data-val="6">6</button>
    <button class="k-btn func" data-val="MR">MR</button>
    <button class="k-btn op" data-key="-" data-val="-">-</button>

    <!-- Row 6: Numpad 3 -->
    <button class="k-btn" data-key="1" data-val="1">1</button>
    <button class="k-btn" data-key="2" data-val="2">2</button>
    <button class="k-btn" data-key="3" data-val="3">3</button>
    <button class="k-btn func" data-val="M+">M+</button>
    <button class="k-btn op" data-key="+" data-val="+">+</button>

    <!-- Row 7: Numpad 4 -->
    <button class="k-btn" data-val="π">π</button>
    <button class="k-btn" data-key="0" data-val="0">0</button>
    <button class="k-btn" data-key="." data-val=".">.</button>
    <button class="k-btn equals" data-key="Enter" data-val="=">=</button>
  </main>

  <!-- History Modal Overlay -->
  <div class="history-overlay" id="history-overlay">
    <div class="history-header">
      <span class="history-title">Riwayat Kalkulasi</span>
      <button class="text-btn" id="close-history">✕ Tutup</button>
    </div>
    <div class="history-list" id="history-list"></div>
  </div>

</div>

<script>
// State Management
let expr = '';
let isDeg = true;
let memory = 0;
let history = [];

// Elements
const display = document.getElementById('display');
const subDisplay = document.getElementById('sub-display');
const badgeDeg = document.getElementById('badge-deg');
const badgeMem = document.getElementById('badge-mem');
const historyOverlay = document.getElementById('history-overlay');
const historyList = document.getElementById('history-list');
const historyBtn = document.getElementById('history-btn');
const closeHistoryBtn = document.getElementById('close-history');
const clearMemBtn = document.getElementById('clear-mem-btn');
const buttons = document.querySelectorAll('.k-btn');

function updateDisplay() {
  display.textContent = expr || '0';
  badgeDeg.textContent = isDeg ? 'DEG' : 'RAD';
  badgeMem.textContent = `MEM: ${memory}`;
  if (memory !== 0) {
    badgeMem.classList.add('active');
  } else {
    badgeMem.classList.remove('active');
  }
}

function factorial(n) {
  if (n < 0) return NaN;
  if (n === 0 || n === 1) return 1;
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}

function evaluateExpression(str) {
  let s = str.replace(/×/g, '*').replace(/÷/g, '/').replace(/%/g, '/100');
  s = s.replace(/π/g, 'Math.PI').replace(/e/g, 'Math.E');
  s = s.replace(/\^/g, '**');
  s = s.replace(/√\(/g, 'Math.sqrt(').replace(/√(\d+(\.\d+)?)/g, 'Math.sqrt($1)');
  s = s.replace(/log\(/g, 'Math.log10(');
  s = s.replace(/ln\(/g, 'Math.log(');
  s = s.replace(/(\d+)!/g, (m, n) => `factorial(${n})`);

  const angleFactor = isDeg ? '(Math.PI/180)*' : '';
  s = s.replace(/sin\(/g, `Math.sin(${angleFactor}`);
  s = s.replace(/cos\(/g, `Math.cos(${angleFactor}`);
  s = s.replace(/tan\(/g, `Math.tan(${angleFactor}`);

  let val = Function('factorial', `'use strict'; return (${s})`)(factorial);
  if (Number.isFinite(val)) {
    return Math.round((val + Number.EPSILON) * 1e8) / 1e8;
  }
  throw new Error('Invalid Computation');
}

function handleInput(val) {
  if (val === 'AC') {
    expr = '';
    subDisplay.textContent = '';
  } else if (val === '⌫') {
    expr = expr.slice(0, -1);
  } else if (val === 'rad-deg') {
    isDeg = !isDeg;
  } else if (val === '=') {
    if (!expr) return;
    try {
      let res = evaluateExpression(expr);
      subDisplay.textContent = `${expr} =`;
      history.unshift({ expr, res });
      if (history.length > 20) history.pop();
      renderHistory();
      expr = String(res);
    } catch {
      expr = 'Error';
    }
  } else if (['sin', 'cos', 'tan', 'log', 'ln'].includes(val)) {
    if (expr === 'Error') expr = '';
    expr += `${val}(`;
  } else if (val === '√') {
    if (expr === 'Error') expr = '';
    expr += '√(';
  } else if (val === 'MS') {
    memory = parseFloat(expr) || 0;
  } else if (val === 'MR') {
    expr += String(memory);
  } else if (val === 'M+') {
    memory += parseFloat(expr) || 0;
  } else {
    if (expr === 'Error') expr = '';
    expr += val;
  }
  updateDisplay();
}

function renderHistory() {
  if (history.length === 0) {
    historyList.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding-top:20px;">Belum ada riwayat</div>';
    return;
  }
  historyList.innerHTML = history.map((item, i) => `
    <div class="history-item" data-index="${i}">
      <div class="history-expr">${item.expr} =</div>
      <div class="history-val">${item.res}</div>
    </div>
  `).join('');

  document.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', () => {
      expr = String(history[el.dataset.index].res);
      updateDisplay();
      historyOverlay.classList.remove('open');
    });
  });
}

// Event Listeners
buttons.forEach(btn => {
  btn.addEventListener('click', () => handleInput(btn.dataset.val));
});

window.addEventListener('keydown', e => {
  if (e.key === 'Enter') e.preventDefault();
  let target = Array.from(buttons).find(b => b.dataset.key === e.key);
  if (target) {
    target.classList.add('active');
    setTimeout(() => target.classList.remove('active'), 100);
    handleInput(target.dataset.val);
  }
});

historyBtn.addEventListener('click', () => historyOverlay.classList.add('open'));
closeHistoryBtn.addEventListener('click', () => historyOverlay.classList.remove('open'));
clearMemBtn.addEventListener('click', () => { memory = 0; updateDisplay(); });

// Init
updateDisplay();
renderHistory();
</script>
</body>
</html>
