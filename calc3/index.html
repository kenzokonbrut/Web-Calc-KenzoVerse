<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KenzoVerse - Professional Web Calculator</title>

<!-- Google Font: Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-body: #09090b;
  --bg-card: rgba(24, 24, 27, 0.75);
  --bg-display: rgba(9, 9, 11, 0.85);
  
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-focus: rgba(255, 255, 255, 0.2);
  
  --btn-num: #18181b;
  --btn-num-hover: #27272a;
  --btn-func: #27272a;
  --btn-func-hover: #3f3f46;
  --btn-op: #2563eb;
  --btn-op-hover: #1d4ed8;
  
  --text-main: #f4f4f5;
  --text-muted: #71717a;
  --text-dim: #a1a1aa;
  
  --radius-card: 20px;
  --radius-btn: 12px;
  --shadow-main: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  background-color: var(--bg-body);
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.12), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.02), transparent 30%);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 20px;
}

/* --- Top Navigation Bar --- */
.navbar {
  width: 100%;
  max-width: 900px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 99px;
  backdrop-filter: blur(12px);
  margin-bottom: 30px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 0.95rem;
  letter-spacing: -0.01em;
}

.brand-icon {
  width: 18px;
  height: 18px;
  background: var(--btn-op);
  border-radius: 5px;
}

.badge {
  font-size: 0.7rem;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 20px;
  background: rgba(37, 99, 235, 0.15);
  color: #60a5fa;
  border: 1px solid rgba(37, 99, 235, 0.3);
}

.nav-links {
  display: flex;
  gap: 16px;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.shortcut-badge {
  font-size: 0.75rem;
  background: var(--btn-num);
  border: 1px solid var(--border-subtle);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--text-dim);
}

/* --- Main Layout --- */
.app-container {
  display: flex;
  gap: 24px;
  width: 100%;
  max-width: 720px;
  justify-content: center;
  align-items: flex-start;
}

/* --- Calculator Card --- */
.calculator {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-card);
  padding: 24px;
  width: 100%;
  max-width: 360px;
  box-shadow: var(--shadow-main);
  backdrop-filter: blur(16px);
}

/* Display */
.display-wrapper {
  background: var(--bg-display);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 20px;
  position: relative;
  transition: border-color 0.2s;
}

.display-wrapper:focus-within, .display-wrapper:hover {
  border-color: var(--border-focus);
}

.sub-display {
  font-size: 0.85rem;
  color: var(--text-muted);
  min-height: 1.2rem;
  text-align: right;
  word-break: break-all;
  margin-bottom: 4px;
}

.main-display-container {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.main-display {
  font-size: 2.2rem;
  font-weight: 600;
  text-align: right;
  width: 100%;
  color: var(--text-main);
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
}

.main-display::-webkit-scrollbar { display: none; }

.copy-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  margin-right: 8px;
  border-radius: 4px;
  transition: color 0.2s;
}

.copy-btn:hover {
  color: var(--text-main);
}

/* Keypad Grid */
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button.key {
  padding: 16px 0;
  font-size: 1.15rem;
  font-weight: 500;
  border: 1px solid transparent;
  border-radius: var(--radius-btn);
  background: var(--btn-num);
  color: var(--text-main);
  cursor: pointer;
  outline: none;
  transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  justify-content: center;
  align-items: center;
}

button.key:hover {
  background: var(--btn-num-hover);
  border-color: var(--border-subtle);
}

button.key:active, button.key.active {
  transform: scale(0.95);
  background: var(--btn-func-hover);
}

button.func {
  background: var(--btn-func);
  color: var(--text-main);
}

button.func:hover {
  background: var(--btn-func-hover);
}

button.operator {
  background: var(--btn-op);
  color: #ffffff;
  font-weight: 600;
}

button.operator:hover {
  background: var(--btn-op-hover);
}

button.double {
  grid-column: span 2;
}

/* --- History Panel --- */
.history-panel {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-card);
  padding: 20px;
  height: 480px;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-main);
  backdrop-filter: blur(16px);
}

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 12px;
}

.history-title {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.clear-history-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 0.75rem;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
  transition: all 0.2s;
}

.clear-history-btn:hover {
  color: #ef4444;
  background: rgba(239, 68, 68, 0.1);
}

.history-list {
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-right: 4px;
}

.history-list::-webkit-scrollbar {
  width: 4px;
}
.history-list::-webkit-scrollbar-thumb {
  background: var(--border-subtle);
  border-radius: 4px;
}

.history-item {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid transparent;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}

.history-item:hover {
  background: var(--btn-num);
  border-color: var(--border-subtle);
}

.history-expr {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.history-res {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text-main);
}

.empty-history {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  color: var(--text-muted);
  font-style: italic;
}

/* Toast Notification */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #18181b;
  border: 1px solid var(--border-focus);
  color: var(--text-main);
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 0.85rem;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
  z-index: 100;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* Footer */
footer {
  margin-top: 40px;
  font-size: 0.8rem;
  color: var(--text-muted);
  text-align: center;
}

/* Responsive UI */
@media (max-width: 680px) {
  .app-container {
    flex-direction: column;
    align-items: center;
  }
  .history-panel {
    width: 100%;
    max-width: 360px;
    height: 220px;
  }
  .nav-links { display: none; }
}
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="brand">
    <div class="brand-icon"></div>
    <span>KenzoVerse</span>
    <span class="badge">Pro v2.0</span>
  </div>
  <div class="nav-links">
    <span>Numpad Ready <span class="shortcut-badge">⌨ Keyboard</span></span>
  </div>
</nav>

<!-- App Content -->
<div class="app-container">
  
  <!-- Calculator Main Card -->
  <main class="calculator">
    <div class="display-wrapper">
      <div class="sub-display" id="sub-display"></div>
      <div class="main-display-container">
        <button class="copy-btn" id="copy-btn" title="Salin Hasil">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
        <div class="main-display" id="display">0</div>
      </div>
    </div>

    <div class="buttons">
      <button class="key func" data-key="Escape" data-value="C">C</button>
      <button class="key func" data-key="Backspace" data-value="⌫">⌫</button>
      <button class="key func" data-key="%" data-value="%">%</button>
      <button class="key operator" data-key="/" data-value="÷">÷</button>

      <button class="key" data-key="7" data-value="7">7</button>
      <button class="key" data-key="8" data-value="8">8</button>
      <button class="key" data-key="9" data-value="9">9</button>
      <button class="key operator" data-key="*" data-value="×">×</button>

      <button class="key" data-key="4" data-value="4">4</button>
      <button class="key" data-key="5" data-value="5">5</button>
      <button class="key" data-key="6" data-value="6">6</button>
      <button class="key operator" data-key="-" data-value="-">-</button>

      <button class="key" data-key="1" data-value="1">1</button>
      <button class="key" data-key="2" data-value="2">2</button>
      <button class="key" data-key="3" data-value="3">3</button>
      <button class="key operator" data-key="+" data-value="+">+</button>

      <button class="key double" data-key="0" data-value="0">0</button>
      <button class="key" data-key="." data-value=".">.</button>
      <button class="key operator" data-key="Enter" data-value="=">=</button>
    </div>
  </main>

  <!-- History Sidebar -->
  <aside class="history-panel">
    <div class="history-header">
      <span class="history-title">Riwayat Riil</span>
      <button class="clear-history-btn" id="clear-history">Hapus Semua</button>
    </div>
    <div class="history-list" id="history-list"></div>
  </aside>

</div>

<!-- Notification Toast -->
<div class="toast" id="toast">Disalin ke clipboard!</div>

<footer>
  &copy; 2026 KenzoVerse. Designed for precision & minimalism.
</footer>

<script>
const display = document.getElementById('display');
const subDisplay = document.getElementById('sub-display');
const keys = document.querySelectorAll('.key');
const historyList = document.getElementById('history-list');
const clearHistoryBtn = document.getElementById('clear-history');
const copyBtn = document.getElementById('copy-btn');
const toast = document.getElementById('toast');

let current = '';
let lastExpression = '';
let history = JSON.parse(localStorage.getItem('kenzo_calc_history')) || [];

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function updateDisplay() {
  display.textContent = current || '0';
  subDisplay.textContent = lastExpression;
}

function addHistory(expr, result) {
  history.unshift({ expr, result });
  if (history.length > 15) history.pop();
  localStorage.setItem('kenzo_calc_history', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  if (history.length === 0) {
    historyList.innerHTML = '<div class="empty-history">Belum ada riwayat</div>';
    return;
  }
  
  historyList.innerHTML = history.map((item, idx) => `
    <div class="history-item" data-index="${idx}">
      <span class="history-expr">${item.expr} =</span>
      <span class="history-res">${item.result}</span>
    </div>
  `).join('');

  document.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', () => {
      const idx = el.dataset.index;
      current = String(history[idx].result);
      updateDisplay();
      showToast('Angka dimuat ke kalkulator');
    });
  });
}

function handleInput(val) {
  const operators = ['+', '-', '×', '÷', '%'];

  if (val === 'C') {
    current = '';
    lastExpression = '';
  } else if (val === '⌫') {
    current = current.toString().slice(0, -1);
  } else if (val === '=') {
    if (!current) return;
    let expr = current;
    let lastChar = expr.slice(-1);
    if (operators.includes(lastChar)) expr = expr.slice(0, -1);
    
    try {
      let sanitized = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/%/g, '/100');
      let rawResult = eval(sanitized);
      
      if (Number.isFinite(rawResult)) {
        let formattedResult = Math.round((rawResult + Number.EPSILON) * 1000000) / 1000000;
        lastExpression = `${expr} =`;
        addHistory(expr, formattedResult);
        current = String(formattedResult);
      }
    } catch {
      current = 'Error';
    }
  } else {
    if (current === 'Error') current = '';
    if (operators.includes(val) && operators.includes(current.slice(-1))) {
      current = current.slice(0, -1) + val;
    } else {
      current += val;
    }
  }
  updateDisplay();
}

// Button Click Events
keys.forEach(key => {
  key.addEventListener('click', () => {
    handleInput(key.dataset.value);
  });
});

// Full Keyboard Support
window.addEventListener('keydown', (e) => {
  let keyVal = e.key;
  if (keyVal === 'Enter') e.preventDefault(); // Prevent accidental form triggers
  
  let targetBtn = Array.from(keys).find(k => k.dataset.key === keyVal);

  if (targetBtn) {
    targetBtn.classList.add('active');
    setTimeout(() => targetBtn.classList.remove('active'), 120);
    handleInput(targetBtn.dataset.value);
  }
});

// Copy Result Event
copyBtn.addEventListener('click', () => {
  if (display.textContent && display.textContent !== 'Error') {
    navigator.clipboard.writeText(display.textContent);
    showToast('Hasil berhasil disalin!');
  }
});

// Clear History Event
clearHistoryBtn.addEventListener('click', () => {
  history = [];
  localStorage.removeItem('kenzo_calc_history');
  renderHistory();
  showToast('Riwayat dibersihkan');
});

// Initial Render
renderHistory();
</script>

</body>
</html>
