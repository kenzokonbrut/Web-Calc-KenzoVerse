<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KenzoVerse - Professional Scientific Calculator</title>

<!-- Google Font: Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-body: #09090b;
  --bg-card: rgba(24, 24, 27, 0.75);
  --bg-display: rgba(9, 9, 11, 0.85);
  
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-focus: rgba(255, 255, 255, 0.2);
  
  --btn-num: #18181b;
  --btn-num-hover: #27272a;
  --btn-func: #27272a;
  --btn-func-hover: #3f3f46;
  --btn-sci: #18181b;
  --btn-sci-hover: #27272a;
  --btn-op: #2563eb;
  --btn-op-hover: #1d4ed8;
  
  --text-main: #f4f4f5;
  --text-muted: #71717a;
  --text-dim: #a1a1aa;
  --accent-blue: #60a5fa;
  
  --radius-card: 20px;
  --radius-btn: 10px;
  --shadow-main: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  background-color: var(--bg-body);
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.12), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.02), transparent 30%);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 20px;
}

/* Navbar */
.navbar {
  width: 100%;
  max-width: 960px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 99px;
  backdrop-filter: blur(12px);
  margin-bottom: 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 0.95rem;
}

.brand-icon {
  width: 18px;
  height: 18px;
  background: var(--btn-op);
  border-radius: 5px;
}

.badge {
  font-size: 0.7rem;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 20px;
  background: rgba(37, 99, 235, 0.15);
  color: var(--accent-blue);
  border: 1px solid rgba(37, 99, 235, 0.3);
}

.mode-badge {
  font-size: 0.75rem;
  background: var(--btn-num);
  border: 1px solid var(--border-subtle);
  padding: 4px 10px;
  border-radius: 20px;
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
}

.mode-badge:hover {
  color: var(--text-main);
  border-color: var(--border-focus);
}

/* App Container */
.app-container {
  display: flex;
  gap: 24px;
  width: 100%;
  max-width: 960px;
  justify-content: center;
  align-items: flex-start;
}

/* Calculator Main Card */
.calculator {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-card);
  padding: 24px;
  width: 100%;
  max-width: 520px;
  box-shadow: var(--shadow-main);
  backdrop-filter: blur(16px);
}

/* Display Section */
.display-wrapper {
  background: var(--bg-display);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 20px;
  position: relative;
  transition: border-color 0.2s;
}

.display-wrapper:hover {
  border-color: var(--border-focus);
}

.top-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.angle-mode {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--accent-blue);
  background: rgba(37, 99, 235, 0.1);
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 0.05em;
}

.sub-display {
  font-size: 0.85rem;
  color: var(--text-muted);
  min-height: 1.2rem;
  text-align: right;
  word-break: break-all;
}

.main-display-container {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-top: 4px;
}

.main-display {
  font-size: 2.2rem;
  font-weight: 600;
  text-align: right;
  width: 100%;
  color: var(--text-main);
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
}

.main-display::-webkit-scrollbar { display: none; }

.copy-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  margin-right: 8px;
  border-radius: 4px;
  transition: color 0.2s;
}

.copy-btn:hover { color: var(--text-main); }

/* Keypad Grid (5 Columns) */
.buttons {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

button.key {
  padding: 14px 0;
  font-size: 0.95rem;
  font-weight: 500;
  border: 1px solid transparent;
  border-radius: var(--radius-btn);
  background: var(--btn-num);
  color: var(--text-main);
  cursor: pointer;
  outline: none;
  transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  justify-content: center;
  align-items: center;
  user-select: none;
}

button.key:hover {
  background: var(--btn-num-hover);
  border-color: var(--border-subtle);
}

button.key:active, button.key.active {
  transform: scale(0.95);
}

button.sci {
  background: var(--btn-sci);
  color: var(--text-dim);
  font-size: 0.88rem;
}

button.sci:hover {
  background: var(--btn-sci-hover);
  color: var(--text-main);
}

button.func {
  background: var(--btn-func);
  color: var(--text-main);
}

button.func:hover {
  background: var(--btn-func-hover);
}

button.operator {
  background: var(--btn-op);
  color: #ffffff;
  font-weight: 600;
}

button.operator:hover {
  background: var(--btn-op-hover);
}

button.double {
  grid-column: span 2;
}

/* History Sidebar */
.history-panel {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-card);
  padding: 20px;
  height: 520px;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-main);
  backdrop-filter: blur(16px);
}

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 12px;
}

.history-title {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.clear-history-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 0.75rem;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
}

.clear-history-btn:hover {
  color: #ef4444;
  background: rgba(239, 68, 68, 0.1);
}

.history-list {
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-list::-webkit-scrollbar { width: 4px; }
.history-list::-webkit-scrollbar-thumb {
  background: var(--border-subtle);
  border-radius: 4px;
}

.history-item {
  background: rgba(255, 255, 255, 0.02);
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  transition: background 0.15s ease;
}

.history-item:hover {
  background: var(--btn-num);
}

.history-expr {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.history-res {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text-main);
}

.empty-history {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  color: var(--text-muted);
  font-style: italic;
}

/* Toast Notification */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #18181b;
  border: 1px solid var(--border-focus);
  color: var(--text-main);
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 0.85rem;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
  z-index: 100;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

footer {
  margin-top: 30px;
  font-size: 0.8rem;
  color: var(--text-muted);
  text-align: center;
}

@media (max-width: 840px) {
  .app-container {
    flex-direction: column;
    align-items: center;
  }
  .history-panel {
    width: 100%;
    max-width: 520px;
    height: 200px;
  }
}
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="brand">
    <div class="brand-icon"></div>
    <span>KenzoVerse</span>
    <span class="badge">Scientific Pro</span>
  </div>
  <div class="mode-badge" id="deg-rad-toggle" title="Klik untuk ubah Deg/Rad Mode">Mode: DEG</div>
</nav>

<!-- Main App Layout -->
<div class="app-container">
  
  <main class="calculator">
    <div class="display-wrapper">
      <div class="top-info">
        <span class="angle-mode" id="angle-mode-indicator">DEG</span>
        <div class="sub-display" id="sub-display"></div>
      </div>
      <div class="main-display-container">
        <button class="copy-btn" id="copy-btn" title="Salin Hasil">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
        <div class="main-display" id="display">0</div>
      </div>
    </div>

    <!-- 5-Column Grid -->
    <div class="buttons">
      <!-- Scientific Row 1 -->
      <button class="key sci" data-value="sin">sin</button>
      <button class="key sci" data-value="cos">cos</button>
      <button class="key sci" data-value="tan">tan</button>
      <button class="key sci" data-value="π">π</button>
      <button class="key func" data-key="Escape" data-value="C">C</button>

      <!-- Scientific Row 2 -->
      <button class="key sci" data-value="√(">√</button>
      <button class="key sci" data-value="^">xʸ</button>
      <button class="key sci" data-value="²">x²</button>
      <button class="key sci" data-value="e">e</button>
      <button class="key func" data-key="Backspace" data-value="⌫">⌫</button>

      <!-- Row 3 -->
      <button class="key sci" data-value="log(">log</button>
      <button class="key sci" data-value="ln(">ln</button>
      <button class="key sci" data-value="(">(</button>
      <button class="key sci" data-value=")">)</button>
      <button class="key operator" data-key="/" data-value="÷">÷</button>

      <!-- Row 4 -->
      <button class="key" data-key="7" data-value="7">7</button>
      <button class="key" data-key="8" data-value="8">8</button>
      <button class="key" data-key="9" data-value="9">9</button>
      <button class="key sci" data-key="%" data-value="%">%</button>
      <button class="key operator" data-key="*" data-value="×">×</button>

      <!-- Row 5 -->
      <button class="key" data-key="4" data-value="4">4</button>
      <button class="key" data-key="5" data-value="5">5</button>
      <button class="key" data-key="6" data-value="6">6</button>
      <button class="key double" data-key="0" data-value="0">0</button>
      <button class="key operator" data-key="-" data-value="-">-</button>

      <!-- Row 6 -->
      <button class="key" data-key="1" data-value="1">1</button>
      <button class="key" data-key="2" data-value="2">2</button>
      <button class="key" data-key="3" data-value="3">3</button>
      <button class="key" data-key="." data-value=".">.</button>
      <button class="key operator" data-key="+" data-value="+">+</button>

      <!-- Equal Button Span -->
      <button class="key operator" style="grid-column: span 5; margin-top: 4px;" data-key="Enter" data-value="=">=</button>
    </div>
  </main>

  <!-- Sidebar Riwayat -->
  <aside class="history-panel">
    <div class="history-header">
      <span class="history-title">Riwayat Kalkulasi</span>
      <button class="clear-history-btn" id="clear-history">Clear</button>
    </div>
    <div class="history-list" id="history-list"></div>
  </aside>

</div>

<div class="toast" id="toast">Disalin ke clipboard!</div>

<footer>
  &copy; 2026 KenzoVerse. Engineered for scientific precision.
</footer>

<script>
const display = document.getElementById('display');
const subDisplay = document.getElementById('sub-display');
const keys = document.querySelectorAll('.key');
const historyList = document.getElementById('history-list');
const clearHistoryBtn = document.getElementById('clear-history');
const copyBtn = document.getElementById('copy-btn');
const toast = document.getElementById('toast');
const degRadToggle = document.getElementById('deg-rad-toggle');
const angleModeIndicator = document.getElementById('angle-mode-indicator');

let current = '';
let lastExpression = '';
let isDeg = true; // True = Degree, False = Radian
let history = JSON.parse(localStorage.getItem('kenzo_sci_history')) || [];

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// Toggle Degree / Radian
degRadToggle.addEventListener('click', () => {
  isDeg = !isDeg;
  const modeText = isDeg ? 'DEG' : 'RAD';
  degRadToggle.textContent = `Mode: ${modeText}`;
  angleModeIndicator.textContent = modeText;
  showToast(`Mode diubah ke ${modeText}`);
});

function updateDisplay() {
  display.textContent = current || '0';
  subDisplay.textContent = lastExpression;
}

function addHistory(expr, result) {
  history.unshift({ expr, result });
  if (history.length > 15) history.pop();
  localStorage.setItem('kenzo_sci_history', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  if (history.length === 0) {
    historyList.innerHTML = '<div class="empty-history">Belum ada riwayat</div>';
    return;
  }
  
  historyList.innerHTML = history.map((item, idx) => `
    <div class="history-item" data-index="${idx}">
      <span class="history-expr">${item.expr} =</span>
      <span class="history-res">${item.result}</span>
    </div>
  `).join('');

  document.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', () => {
      const idx = el.dataset.index;
      current = String(history[idx].result);
      updateDisplay();
      showToast('Angka dimuat ke kalkulator');
    });
  });
}

// Evaluasi ekspresi Matematika Ilmiah
function calculateScientific(expr) {
  let sanitized = expr;

  // Replacement konversi dasar
  sanitized = sanitized.replace(/×/g, '*').replace(/÷/g, '/').replace(/%/g, '/100');
  sanitized = sanitized.replace(/π/g, 'Math.PI').replace(/e/g, 'Math.E');
  sanitized = sanitized.replace(/²/g, '**2').replace(/\^/g, '**');
  sanitized = sanitized.replace(/√\(/g, 'Math.sqrt(');
  sanitized = sanitized.replace(/log\(/g, 'Math.log10(');
  sanitized = sanitized.replace(/ln\(/g, 'Math.log(');

  // Trigonometri dengan penanganan DEG / RAD
  const radFactor = isDeg ? '(Math.PI/180)*' : '';
  
  sanitized = sanitized.replace(/sin\(/g, `Math.sin(${radFactor}`);
  sanitized = sanitized.replace(/cos\(/g, `Math.cos(${radFactor}`);
  sanitized = sanitized.replace(/tan\(/g, `Math.tan(${radFactor}`);

  let result = Function(`'use strict'; return (${sanitized})`)();
  
  // Pembulatan presisi presisi tinggi
  if (Number.isFinite(result)) {
    return Math.round((result + Number.EPSILON) * 100000000) / 100000000;
  }
  return 'Error';
}

function handleInput(val) {
  const operators = ['+', '-', '×', '÷', '^', '%'];

  if (val === 'C') {
    current = '';
    lastExpression = '';
  } else if (val === '⌫') {
    current = current.toString().slice(0, -1);
  } else if (val === '=') {
    if (!current) return;
    try {
      let result = calculateScientific(current);
      lastExpression = `${current} =`;
      addHistory(current, result);
      current = String(result);
    } catch (e) {
      current = 'Error';
    }
  } else if (['sin', 'cos', 'tan'].includes(val)) {
    if (current === 'Error') current = '';
    current += `${val}(`;
  } else {
    if (current === 'Error') current = '';
    if (operators.includes(val) && operators.includes(current.slice(-1))) {
      current = current.slice(0, -1) + val;
    } else {
      current += val;
    }
  }
  updateDisplay();
}

// Keypad Click Event
keys.forEach(key => {
  key.addEventListener('click', () => {
    handleInput(key.dataset.value);
  });
});

// Keyboard Support
window.addEventListener('keydown', (e) => {
  let keyVal = e.key;
  if (keyVal === 'Enter') e.preventDefault();

  let targetBtn = Array.from(keys).find(k => k.dataset.key === keyVal);

  if (targetBtn) {
    targetBtn.classList.add('active');
    setTimeout(() => targetBtn.classList.remove('active'), 120);
    handleInput(targetBtn.dataset.value);
  }
});

// Copy Result
copyBtn.addEventListener('click', () => {
  if (display.textContent && display.textContent !== 'Error') {
    navigator.clipboard.writeText(display.textContent);
    showToast('Hasil berhasil disalin!');
  }
});

// Clear History
clearHistoryBtn.addEventListener('click', () => {
  history = [];
  localStorage.removeItem('kenzo_sci_history');
  renderHistory();
  showToast('Riwayat dibersihkan');
});

renderHistory();
</script>

</body>
</html>
