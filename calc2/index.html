<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KenzoVerse Calculator</title>
<style>
:root {
  --bg-main: #09090b;
  --panel-bg: #18181b;
  --btn-num: #27272a;
  --btn-num-hover: #3f3f46;
  --btn-func: #3f3f46;
  --btn-func-hover: #52525b;
  --btn-op: #2563eb;
  --btn-op-hover: #1d4ed8;
  --text-primary: #f4f4f5;
  --text-secondary: #a1a1aa;
  --border-color: #27272a;
  --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-main);
  color: var(--text-primary);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.calculator {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  border-radius: 24px;
  padding: 24px;
  width: 100%;
  max-width: 340px;
  box-shadow: var(--shadow);
}

.header {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
  margin-bottom: 16px;
  text-transform: uppercase;
}

.display-container {
  background: #09090b;
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 16px 20px;
  margin-bottom: 20px;
  text-align: right;
  word-break: break-all;
}

.sub-display {
  font-size: 0.85rem;
  color: var(--text-secondary);
  min-height: 1.2rem;
  margin-bottom: 4px;
}

.main-display {
  font-size: 2rem;
  font-weight: 600;
  color: var(--text-primary);
  min-height: 2.5rem;
  line-height: 1.2;
  overflow-x: auto;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button {
  padding: 16px 0;
  font-size: 1.1rem;
  font-weight: 500;
  border: none;
  border-radius: 12px;
  background: var(--btn-num);
  color: var(--text-primary);
  cursor: pointer;
  transition: background-color 0.15s ease, transform 0.05s ease;
  user-select: none;
}

button:hover {
  background: var(--btn-num-hover);
}

button:active {
  transform: scale(0.96);
}

button.func {
  background: var(--btn-func);
  color: var(--text-primary);
}

button.func:hover {
  background: var(--btn-func-hover);
}

button.operator {
  background: var(--btn-op);
  color: #ffffff;
}

button.operator:hover {
  background: var(--btn-op-hover);
}

button.double {
  grid-column: span 2;
}

.history-section {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border-color);
}

.history-title {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.history-list {
  max-height: 100px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.history-item {
  font-size: 0.85rem;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 6px 8px;
  border-radius: 6px;
  transition: background 0.15s ease, color 0.15s ease;
  display: flex;
  justify-content: space-between;
}

.history-item:hover {
  background: var(--btn-num);
  color: var(--text-primary);
}
</style>
</head>
<body>

<div class="calculator">
  <div class="header">KenzoVerse</div>
  <div class="display-container">
    <div class="sub-display" id="sub-display"></div>
    <div class="main-display" id="display">0</div>
  </div>
  <div class="buttons">
    <button class="func" data-value="C">C</button>
    <button class="func" data-value="⌫">⌫</button>
    <button class="func" data-value="%">%</button>
    <button class="operator" data-value="÷">÷</button>

    <button data-value="7">7</button>
    <button data-value="8">8</button>
    <button data-value="9">9</button>
    <button class="operator" data-value="×">×</button>

    <button data-value="4">4</button>
    <button data-value="5">5</button>
    <button data-value="6">6</button>
    <button class="operator" data-value="-">-</button>

    <button data-value="1">1</button>
    <button data-value="2">2</button>
    <button data-value="3">3</button>
    <button class="operator" data-value="+">+</button>

    <button class="double" data-value="0">0</button>
    <button data-value=".">.</button>
    <button class="operator" data-value="=">=</button>
  </div>
  <div class="history-section">
    <div class="history-title">Riwayat</div>
    <div class="history-list" id="history"></div>
  </div>
</div>

<script>
const display = document.getElementById('display');
const subDisplay = document.getElementById('sub-display');
const buttons = document.querySelectorAll('button');
const historyEl = document.getElementById('history');

let current = '';
let lastExpression = '';
let history = JSON.parse(localStorage.getItem('calcHistory')) || [];

function updateDisplay() {
  display.textContent = current || '0';
  subDisplay.textContent = lastExpression;
}

function addHistory(expr, result) {
  history.unshift({ expr, result });
  if (history.length > 10) history.pop();
  localStorage.setItem('calcHistory', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  if (history.length === 0) {
    historyEl.innerHTML = '<span style="font-size:0.8rem; color:var(--text-secondary);">Belum ada riwayat</span>';
    return;
  }
  
  historyEl.innerHTML = history.map((item, index) => 
    `<div class="history-item" data-index="${index}">
      <span>${item.expr}</span>
      <strong>= ${item.result}</strong>
    </div>`
  ).join('');
  
  document.querySelectorAll('.history-item').forEach(item => {
    item.addEventListener('click', e => {
      const idx = e.currentTarget.dataset.index;
      current = String(history[idx].result);
      updateDisplay();
    });
  });
}

renderHistory();

buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    const val = btn.dataset.value;
    const operators = ['+', '-', '×', '÷', '%'];

    if (val === 'C') {
      current = '';
      lastExpression = '';
    } else if (val === '⌫') {
      current = current.toString().slice(0, -1);
    } else if (val === '=') {
      if (!current) return;
      let expr = current;
      let lastChar = expr.slice(-1);
      if (operators.includes(lastChar)) expr = expr.slice(0, -1);
      try {
        let sanitized = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/%/g, '/100');
        let rawResult = eval(sanitized);
        if (Number.isFinite(rawResult)) {
          let formattedResult = Math.round((rawResult + Number.EPSILON) * 1000000) / 1000000;
          lastExpression = `${expr} =`;
          addHistory(expr, formattedResult);
          current = String(formattedResult);
        }
      } catch {
        current = 'Error';
      }
    } else {
      if (current === 'Error') current = '';
      if (operators.includes(val) && operators.includes(current.slice(-1))) {
        current = current.slice(0, -1) + val;
      } else {
        current += val;
      }
    }

    updateDisplay();
  });
});
</script>

</body>
</html>
